name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and run packet checks
        run: ./scripts/check.sh
      - name: Build and verify universal app
        run: ./scripts/build-app.sh
